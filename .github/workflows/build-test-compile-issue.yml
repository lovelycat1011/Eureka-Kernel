name: Test Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-compile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - { model: "A105", defconfig: "exynos7885-a10_defconfig" }
          - { model: "A205", defconfig: "exynos7885-a20_defconfig" }
          - { model: "A202", defconfig: "exynos7885-a20e_defconfig" }
          - { model: "A305", defconfig: "exynos7885-a30_defconfig" }
          - { model: "A307", defconfig: "exynos7885-a30s_defconfig" }
          - { model: "A405", defconfig: "exynos7885-a40_defconfig" }
          - { model: "A3050", defconfig: "exynos7885-a40s_defconfig" }
          - { model: "M205", defconfig: "exynos7885-m20_enforcing_defconfig" }

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Cache proton-clang
      uses: actions/cache@v3
      id: cache-proton
      with:
        path: proton-clang
        key: proton-clang-test-${{ runner.os }}-v2
        restore-keys: |
          proton-clang-test-${{ runner.os }}-

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install dependencies and setup toolchain
      run: |
        # Install minimal dependencies
        sudo apt-get update -y
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils make python3 libssl-dev build-essential \
          bc bison flex unzip ca-certificates
        
        # Setup toolchain - fix cache logic
        if [ "${{ steps.cache-proton.outputs.cache-hit }}" != 'true' ]; then
          echo "Cache miss - cloning proton-clang..."
          rm -rf proton-clang  # Remove any existing directory
          git clone https://github.com/kdrag0n/proton-clang --depth=1 -b master
        else
          echo "Cache hit - using cached proton-clang"
        fi
        
        # Verify toolchain exists
        if [ ! -d "proton-clang" ]; then
          echo "Error: proton-clang directory not found!"
          exit 1
        fi
        
        ln -sf proton-clang toolchain

    - name: Apply Compilation Fix Patches
      run: |
        echo "🔧 Applying compilation fix patches for ${{ matrix.device.model }}..."
        
        # Fix 1: include/asm-generic/pgtable.h (if exists)
        if [ -f "include/asm-generic/pgtable.h" ]; then
          echo "Patching include/asm-generic/pgtable.h..."
          
          if ! grep -q "extern unsigned long uksm_zero_pfn __read_mostly;" include/asm-generic/pgtable.h; then
            sed -i '/^#ifdef CONFIG_UKSM$/i\
          extern unsigned long uksm_zero_pfn __read_mostly;\
          extern unsigned long zero_pfn __read_mostly;' include/asm-generic/pgtable.h
          fi
          
          sed -i '/^\s*extern __read_mostly unsigned long uksm_zero_pfn;$/d' include/asm-generic/pgtable.h
          sed -i '/^\s*extern unsigned long zero_pfn;$/d' include/asm-generic/pgtable.h
          
          echo "✅ Fixed include/asm-generic/pgtable.h"
        fi
        
        # Fix 2: s6d7at0b_a10_lcd_ctrl.c (only for A10)
        if [ "${{ matrix.device.model }}" == "A105" ] && [ -f "drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c" ]; then
          echo "Patching s6d7at0b_a10_lcd_ctrl.c brightness calculation..."
          
          sed -i 's/int value = lcd->custom_brightness \* 1\.2;/int value = (lcd->custom_brightness * 12) \/ 10;/' \
            drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c
            
          echo "✅ Fixed s6d7at0b_a10_lcd_ctrl.c brightness calculation"
        fi
        
        # Fix 3: decon_reg.c (if exists)
        if [ -f "drivers/video/fbdev/exynos/dpu_7885/decon_reg.c" ]; then
          echo "Patching decon_reg.c data type..."
          
          sed -i 's/const double decon_clocks_table\[\]\[CLK_ID_MAX\]/const long decon_clocks_table[][CLK_ID_MAX]/' \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
            
          echo "✅ Fixed decon_reg.c data type"
        fi
        
        echo "✅ All compilation fix patches applied for ${{ matrix.device.model }}!"

    - name: Test Compile Kernel - ${{ matrix.device.model }}
      run: |
        echo "🔨 Testing compilation for ${{ matrix.device.model }}..."
        
        # Set build environment
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain/bin/arm-linux-gnueabi-
        export PATH="$(pwd)/toolchain/bin:${PATH}"
        export LD_LIBRARY_PATH="$(pwd)/toolchain/lib:$LD_LIBRARY_PATH"
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJDUMP=llvm-objdump
        export OBJCOPY=llvm-objcopy
        export STRIP=llvm-strip
        export KCFLAGS=-w
        
        # Clean build
        make clean
        make mrproper
        
        # Make defconfig
        echo "Making defconfig: ${{ matrix.device.defconfig }}"
        make O=out ARCH=arm64 ${{ matrix.device.defconfig }}
        
        if [ ! -f "out/.config" ]; then
          echo "❌ Failed to create .config for ${{ matrix.device.model }}"
          exit 1
        fi
        
        # Test compile (full build, ~20-25 minutes per device)
        echo "Starting test compilation..."
        timeout 1500 make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          AR=llvm-ar NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip \
          LD_LIBRARY_PATH="$(pwd)/toolchain/lib:$LD_LIBRARY_PATH" || {
            
            COMPILE_EXIT_CODE=$?
            if [ $COMPILE_EXIT_CODE -eq 124 ]; then
              echo "⏱️ Compilation timeout reached (25 minutes) - possible hang or very slow build"
              echo "COMPILE_RESULT=timeout_hang" >> $GITHUB_ENV
            else
              echo "❌ Compilation failed with exit code $COMPILE_EXIT_CODE"
              echo "COMPILE_RESULT=failed" >> $GITHUB_ENV
              exit 1
            fi
          } && {
            echo "✅ Compilation completed successfully!"
            echo "COMPILE_RESULT=success" >> $GITHUB_ENV
          }

    - name: Generate Build Summary
      if: always()
      run: |
        echo "## 📋 Compile Test Results for ${{ matrix.device.model }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Device:** ${{ matrix.device.model }}" >> $GITHUB_STEP_SUMMARY
        echo "**Defconfig:** ${{ matrix.device.defconfig }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "$COMPILE_RESULT" == "success" ]; then
          echo "**Status:** ✅ Compilation Success" >> $GITHUB_STEP_SUMMARY
        elif [ "$COMPILE_RESULT" == "timeout_hang" ]; then
          echo "**Status:** ⏱️ Timeout after 25 minutes (possible hang)" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status:** ❌ Compilation Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Patches Applied:**" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ pgtable.h extern declarations fix" >> $GITHUB_STEP_SUMMARY
        if [ "${{ matrix.device.model }}" == "A105" ]; then
          echo "- ✅ A10 LCD controller brightness fix" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- ✅ decon_reg.c data type fix" >> $GITHUB_STEP_SUMMARY
