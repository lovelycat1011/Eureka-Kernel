name: Test Compile

on:
  workflow_dispatch:
    inputs:
      android_variant:
        description: 'Android Variant'
        required: true
        default: 'aosp_legacy'
        type: choice
        options:
        - aosp_legacy
        - oneui3
      selinux_mode:
        description: 'SELinux Mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
        - enforcing
        - permissive

jobs:
  build:
    # This strategy creates a parallel job for each device model.
    # fail-fast: false ensures that if one device fails, the others continue building.
    strategy:
      fail-fast: false
      matrix:
        # --- MODIFIED: Updated the list of devices to build for ---
        device_model: [A105, A205, A202, A305, A307, A405]

    runs-on: ubuntu-22.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 100

    - name: Initialize Submodules
      run: |
        git submodule update --init --recursive
        
    - name: Setup KernelSU-Next
      run: |
        # Remove existing KernelSU setup
        rm -rf KernelSU-Next KernelSU drivers/kernelsu
        # Install latest KernelSU-Next 1.0.9
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.9
        # Verify installation
        ls -la drivers/kernelsu/
        ls -la drivers/kernelsu/Kconfig || echo "Kconfig not found"

    - name: Cache Proton Clang
      uses: actions/cache@v3
      id: cache-proton
      with:
        path: proton-clang
        key: proton-clang-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          proton-clang-${{ runner.os }}-

    - name: Cache APT Packages
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: apt-cache-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          apt-cache-${{ runner.os }}-

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install Dependencies & Setup Toolchain
      run: |
        if [ -f "/etc/apt/sources.list.d/ubuntu.sources" ]; then
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources~
          sudo sed -Ei 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        else
          sudo cp /etc/apt/sources.list /etc/apt/sources.list~
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
        fi
        sudo apt-get update -y
        sudo apt install -y \
        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
        binutils make python3 python2 libssl-dev build-essential \
        bc bison flex unzip ca-certificates xz-utils \
        mkbootimg cpio device-tree-compiler git git-lfs gawk
        
        if [ "${{ steps.cache-proton.outputs.cache-hit }}" != 'true' ]; then
          echo "Cache for proton-clang missed. Cloning..."
          rm -rf proton-clang
          git clone https://github.com/kdrag0n/proton-clang --depth=1 -b master
        else
          echo "Cache for proton-clang hit. Skipping clone."
        fi
        
        ln -sf proton-clang toolchain

    - name: Patch KernelSU Hooks
      working-directory: '/home/runner/work/Eureka-Kernel/Eureka-Kernel/'
      run: |
        sudo apt-get build-dep -y coccinelle
        
        git clone --depth=1 https://github.com/coccinelle/coccinelle.git
        cd ./coccinelle/
        ./autogen && ./configure && make -j$(nproc --all) && sudo make -j$(nproc --all) install
        cd ..
        
        git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git
        
        for p in fs drivers/input drivers/tty arch/arm/kernel; do 
          spatch --sp-file ./kernelsu-coccinelle/scope-minimized-hooks/kernelsu-scope-minimized.cocci --in-place --linux-spacing "$p"
        done
        
        rm -rf ./kernelsu-coccinelle/
        rm -rf ./android/abi_gki_protected_exports*
        
        make clean && make mrproper

    - name: Apply Compilation Fix Patches
      run: |
        echo "🔧 Applying compilation fix patches..."
        
        if [ -f "include/asm-generic/pgtable.h" ]; then
          if ! grep -q "extern unsigned long uksm_zero_pfn __read_mostly;" include/asm-generic/pgtable.h; then
            sed -i '/^#ifdef CONFIG_UKSM$/i\
            extern unsigned long uksm_zero_pfn __read_mostly;\
            extern unsigned long zero_pfn __read_mostly;' include/asm-generic/pgtable.h
          fi
          sed -i '/^\s*extern __read_mostly unsigned long uksm_zero_pfn;$/d' include/asm-generic/pgtable.h
          sed -i '/^\s*extern unsigned long zero_pfn;$/d' include/asm-generic/pgtable.h
        fi
        
        if [ -f "drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c" ]; then
          sed -i 's/int value = lcd->custom_brightness \* 1\.2;/int value = (lcd->custom_brightness * 12) \/ 10;/' \
            drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c
        fi
        
        if [ -f "drivers/video/fbdev/exynos/dpu_7885/decon_reg.c" ]; then
          sed -i 's/const double decon_clocks_table\[\]\[CLK_ID_MAX\]/const long decon_clocks_table[][CLK_ID_MAX]/' \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
        fi
        
        echo "✅ All compilation fix patches applied successfully!"

    - name: Configure Build Environment
      run: |
        echo "Configuring for Android variant: ${{ github.event.inputs.android_variant }}"
        echo "SELinux mode: ${{ github.event.inputs.selinux_mode }}"
        echo "Device: ${{ matrix.device_model }}"
        
        # --- MODIFIED: Removed unused device cases ---
        case "${{ matrix.device_model }}" in
          "A105")
            export CODENAME=A105; export KERNEL_DEFCONFIG=exynos7885-a10_defconfig ;;
          "A205")
            export CODENAME=A205; export KERNEL_DEFCONFIG=exynos7885-a20_defconfig ;;
          "A202")
            export CODENAME=A202; export KERNEL_DEFCONFIG=exynos7885-a20e_defconfig ;;
          "A305")
            export CODENAME=A305; export KERNEL_DEFCONFIG=exynos7885-a30_defconfig ;;
          "A307")
            export CODENAME=A307; export KERNEL_DEFCONFIG=exynos7885-a30s_defconfig ;;
          "A405")
            export CODENAME=A405; export KERNEL_DEFCONFIG=exynos7885-a40_defconfig ;;
        esac
        
        if [ ! -e "arch/arm64/boot/dts/exynos/dtb/exynos7885.dts.bak" ]; then
          cp arch/arm64/boot/dts/exynos/dtb/exynos7885.dts arch/arm64/boot/dts/exynos/dtb/exynos7885.dts.bak
        fi
        if [ ! -e "drivers/media/platform/exynos/Kconfig.bak" ]; then
          cp drivers/media/platform/exynos/Kconfig drivers/media/platform/exynos/Kconfig.bak
        fi
        
        LINE=$(grep -n 'sel_boot_state' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts | gawk '{print $1}' FS=":")
        if [ "${{ github.event.inputs.selinux_mode }}" == "enforcing" ]; then
          sed -i ${LINE}'s/.*/		sel_boot_state = <0>;/' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts
        else
          sed -i ${LINE}'s/.*/		sel_boot_state = <1>;/' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts
        fi
        
        LINE_VARIANT=$(grep -n 'eureka_kernel_variant' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts | gawk '{print $1}' FS=":")
        if [ "${{ github.event.inputs.android_variant }}" == "oneui3" ]; then
          sed -i ${LINE_VARIANT}'s/.*/			eureka_kernel_variant = <3>;/' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts
          sed -i '55s/.*/        default y/' drivers/media/platform/exynos/Kconfig
          export ONEUI3=1; export ANDROID_VAR="OneUI3"; export ANDROID=r; export AND_VER=11
        else
          sed -i ${LINE_VARIANT}'s/.*/			eureka_kernel_variant = <2>;/' arch/arm64/boot/dts/exynos/dtb/exynos7885.dts
          export ONEUI3=0; export ANDROID_VAR="AOSP-Legacy"; export ANDROID=r; export AND_VER=11
        fi
        
        echo "CODENAME=${CODENAME}" >> $GITHUB_ENV
        echo "KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG}" >> $GITHUB_ENV
        echo "ONEUI3=${ONEUI3}" >> $GITHUB_ENV
        echo "ANDROID_VAR=${ANDROID_VAR}" >> $GITHUB_ENV
        echo "ANDROID=${ANDROID}" >> $GITHUB_ENV
        echo "AND_VER=${AND_VER}" >> $GITHUB_ENV

    - name: Build Kernel for ${{ matrix.device_model }}
      run: |
        export KERNEL_DIR=$(pwd)
        export ARCH=arm64
        export KBUILD_BUILD_USER=Eureka
        export KBUILD_BUILD_HOST=Eureka.org
        export ANDROID_MAJOR_VERSION=${{ env.ANDROID }}
        export PLATFORM_VERSION=${{ env.AND_VER }}
        export PATH="$KERNEL_DIR/toolchain/bin:${PATH}"
        export LD_LIBRARY_PATH="$KERNEL_DIR/toolchain/lib:$LD_LIBRARY_PATH"
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain/bin/arm-linux-gnueabi-
        export AR=llvm-ar; export NM=llvm-nm; export OBJDUMP=llvm-objdump; export STRIP=llvm-strip
        export KCFLAGS=-w

        REV=${{ github.run_number }}
        if [ "${{ env.ONEUI3 }}" == "1" ]; then
          export LOCALVERSION=-EurekaR${REV}_${{ env.CODENAME }}_S
        else
          export LOCALVERSION=-EurekaR${REV}_${{ env.CODENAME }}_QRS
        fi
        
        make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=${{ env.ANDROID }} ${{ env.KERNEL_DEFCONFIG }}
        
        CONFIG_FILE="out/.config"
        # Disable configs for stability and KSU manual hooks
        sed -i '/^CONFIG_KPROBES/d' "$CONFIG_FILE" && echo "# CONFIG_KPROBES is not set" >> "$CONFIG_FILE"
        sed -i '/^CONFIG_LTO/d' "$CONFIG_FILE" && echo "# CONFIG_LTO is not set" >> "$CONFIG_FILE"
        sed -i '/^CONFIG_CFI_CLANG/d' "$CONFIG_FILE" && echo "# CONFIG_CFI_CLANG is not set" >> "$CONFIG_FILE"
        # Enable required KSU configs
        echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
        echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$CONFIG_FILE"
        echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
        echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"

        make -j$(nproc --all) O=out ARCH=arm64 \
          ANDROID_MAJOR_VERSION=${{ env.ANDROID }} \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        if [ -f "out/arch/arm64/boot/Image" ]; then
          cp -f out/arch/arm64/boot/Image arch/arm64/boot/Image
        else
          echo "❌ Image build failed!" && exit 1
        fi
        if [ -f "out/arch/arm64/boot/dtb.img" ]; then
          cp -f out/arch/arm64/boot/dtb.img arch/arm64/boot/dtb.img
        fi
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp -f out/arch/arm64/boot/dtbo.img arch/arm64/boot/dtbo.img
        fi

    - name: Package AnyKernel3 Zip for ${{ matrix.device_model }}
      run: |
        cd kernel_zip/anykernel/
        REV=${{ github.run_number }}
        if [ "${{ env.ONEUI3 }}" == "1" ]; then
          ZIPNAME="Eureka_R${REV}_${{ env.CODENAME }}_${{ github.event.inputs.selinux_mode }}_S_KSUN.zip"
        else
          ZIPNAME="Eureka_R${REV}_${{ env.CODENAME }}_${{ github.event.inputs.selinux_mode }}_Legacy_QRS_KSUN.zip"
        fi
        
        cp -f ../../arch/arm64/boot/Image Image
        if [ -f "../../arch/arm64/boot/dtb.img" ]; then
            cp -f ../../arch/arm64/boot/dtb.img dtb.img
        fi

        # --- MODIFIED: Removed unused device cases for DTBO ---
        case "${{ env.CODENAME }}" in
          "A105") cp -f ../dtbo/a10/dtbo.img dtbo.img 2>/dev/null ;;
          "A205") cp -f ../dtbo/a20/dtbo.img dtbo.img 2>/dev/null ;;
          "A202") cp -f ../dtbo/a20e/dtbo.img dtbo.img 2>/dev/null ;;
          "A305") cp -f ../dtbo/a30/dtbo.img dtbo.img 2>/dev/null ;;
          "A307") cp -f ../dtbo/a30s/dtbo.img dtbo.img 2>/dev/null ;;
          "A405") cp -f ../dtbo/a40/dtbo.img dtbo.img 2>/dev/null ;;
        esac
        
        zip -r9 $ZIPNAME . -x ".git*" "*placeholder"
        
        echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
        cd ../../

    - name: Create boot.img for ${{ matrix.device_model }}
      run: |
        git clone --depth=1 https://github.com/SebaUbuntu/AIK-Linux-mirror AIK-Linux
        
        if [ ! -f "prebuilt/boot.img.zip" ]; then
          echo "Stock boot.img.zip not found. Skipping."
          exit 0
        fi

        unzip "prebuilt/boot.img.zip" -d AIK-Linux
        cd AIK-Linux
        ./unpackimg.sh
        cp ../arch/arm64/boot/Image split_img/boot.img-kernel
        ./repackimg.sh
        
        if [ "${{ env.ONEUI3 }}" == "1" ]; then
          FINAL_BOOT_FILENAME="ksun-oneui-${{ matrix.device_model }}.img"
        else
          FINAL_BOOT_FILENAME="ksun-aosp-${{ matrix.device_model }}.img"
        fi
        
        mv image-new.img "../${FINAL_BOOT_FILENAME}"
        echo "BOOT_IMG_FILENAME=${FINAL_BOOT_FILENAME}" >> $GITHUB_ENV
        cd ..

    - name: Upload Build Artifacts for ${{ matrix.device_model }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ANDROID_VAR }}-${{ env.CODENAME }}-${{ github.event.inputs.selinux_mode }}-R${{ github.run_number }}
        path: |
          kernel_zip/anykernel/${{ env.ZIPNAME }}
          ${{ env.BOOT_IMG_FILENAME }}
        if-no-files-found: error

    - name: Generate Build Summary for ${{ matrix.device_model }}
      run: |
        echo "## 🚀 Kernel Build Summary for ${{ env.CODENAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Android Variant:** ${{ env.ANDROID_VAR }}" >> $GITHUB_STEP_SUMMARY  
        echo "- **SELinux Mode:** ${{ github.event.inputs.selinux_mode }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Kernel Version:** Eureka R${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
